; EXEMPLO NÃO ATIVO: execute CALIBRAR.bat para substituir pelas medidas reais.
; Coordenadas em pixels físicos, relativas à ÁREA CLIENTE, sem barra de título.
; Não mude calibrado manualmente: números de exemplo não são seguros para clicar.

; Calibração separada das preferências da rotina.
[calibracao]
; O assistente altera para sim somente depois da validação e sua confirmação.
calibrado = nao
; Título exato da janela calibrada, igual ao config.ini.
titulo = BlueStacks App Player
; Largura da área cliente, não a resolução interna presumida do Android.
largura_cliente = 1280
; Altura da área cliente, sem moldura do Windows.
altura_cliente = 720
; Distância da esquerda da área cliente até o início do readout (F1).
ocr_x = 20
; Distância do topo da área cliente até o início do readout (F1).
ocr_y = 20
; Largura F2.x menos F1.x, incluindo ambos os valores com folga.
ocr_largura = 250
; Altura F2.y menos F1.y.
ocr_altura = 40
; Centro horizontal do joystick (F3).
joystick_x = 180
; Centro vertical do joystick (F3).
joystick_y = 550
; Distância entre F3 e F4, até a borda útil do joystick.
joystick_raio = 65
