; BaseBot — salve em UTF-8 no Bloco de Notas. Comentários ficam em linhas separadas.
; Faixas: minimo,maximo em segundos, com PONTO decimal. Exemplo: 0.5,0.9.
; Não coloque aspas em caminhos. Horas usam o relógio LOCAL do Windows.
; Durações-limite e horário não são intervalos de espera; todos os waits usam faixas.

; Alvo e duração da rotina pessoal.
[rotina]
; Coordenada horizontal desejada.
alvo_x = 510
; Coordenada vertical desejada.
alvo_y = 732
; Começa neste horário; se já passou, começa amanhã; no mesmo minuto, imediatamente.
hora_inicio = 23:00
; Minutos contados a partir da primeira chegada, incluindo correções/reconexões.
minutos_permanencia = 30
; Aceita cada eixo com erro absoluto menor ou igual a este valor.
tolerancia = 5
; sim se o Y do app cresce PARA CIMA; nao se cresce PARA BAIXO na tela.
inverter_y = nao

; Identificação da janela, sem busca parcial por título.
[janela]
; Copie o título EXATO mostrado na janela; altere para o seu BlueStacks/LDPlayer.
titulo = BlueStacks App Player
; Opcional: caminho completo do EXE, sem argumentos; vazio não abre automaticamente.
caminho_emulador =

; Leitura visual; Tesseract deve estar instalado separadamente com idioma eng.
[ocr]
; Vazio: busca no PATH, Program Files e LocalAppData/Tesseract-OCR.
caminho_tesseract =
; Binarização de 0 a 255; ajuste se a fonte ficar ilegível após o filtro.
threshold = 150
; sim para texto claro em fundo escuro, para produzir texto preto em fundo branco.
inverter_imagem = sim
; Whitelist numérica com X/Y, dois-pontos e sinal para preservar os dois campos.
; Para somente dígitos use 0123456789; se o OCR juntar os valores, a leitura é rejeitada.
; Sem espaços/aspas aqui: evita ambiguidade no repasse de argumentos no Windows.
whitelist = 0123456789XYxy:-
; Três tentativas antes de abortar, sempre com mouse solto.
tentativas = 3
; Menor coordenada permitida; restringir ajuda a rejeitar leituras impossíveis.
coordenada_minima = -100000
; Maior coordenada permitida.
coordenada_maxima = 100000

; Direção relativa: assume X crescente à direita e movimento aproximadamente linear.
[controle]
; Dentro desta distância por eixo, usa pulsos menores (pulso_perto).
distancia_desaceleracao = 25
; Jitter angular máximo em graus, de 0 a 15; zero é mais estável perto do alvo.
; A variação de duração também é jitter. Não há promessa de convergência em obstáculos.
jitter_angular_graus = 0

; Limites de segurança são prazos máximos, não pausas fixas.
[seguranca]
; Segundos máximos para cada navegação/correção, excluindo tempo de reconexão.
timeout_navegacao = 300
; Aborta após este número de leituras sem melhorar o melhor erro observado.
limite_sem_progresso = 20
; Até dez minutos tentando recuperar janela/foco, salvo fim da permanência.
timeout_reconexao = 600

; Assistente executado uma vez por resolução/layout/DPI de cada máquina.
[calibracao]
; Duração da tela de validação ao vivo; uma chamada OCR pode terminar depois do prazo.
segundos_validacao = 10

; Micro-input opcional: não é possível escolher uma tecla universalmente inofensiva.
[keep_alive]
; Habilite somente depois de testar uma tecla inofensiva no seu app/mapeamento.
habilitado = nao
; Uma letra, dígito, shift, ctrl, alt ou space; nunca F12. Padrão: shift.
tecla = shift

; Notificação de conclusão; URL funciona como segredo e nunca deve ser compartilhada.
[notificacoes]
; Opcional: cole a URL HTTPS completa do webhook de um canal seu no Discord.
webhook_discord =
; sim faz o processo retornar erro se o webhook falhar depois da rotina concluída.
falha_fatal = nao

; Todas as esperas periódicas e durações de input, em segundos (mínimo,máximo).
[tempos]
; Pulso de joystick longe do alvo.
pulso = 0.5,0.9
; Pulso reduzido perto do alvo; ajuste para a velocidade do personagem.
pulso_perto = 0.08,0.18
; Estabilização entre soltar joystick e obter outra leitura.
entre_pulsos = 0.12,0.25
; Pausa entre tentativas de OCR com falha.
retry_ocr = 0.15,0.35
; Timeout de cada processo Tesseract; independente da thread de emergência.
timeout_ocr = 2,4
; Intervalo de manutenção de posição durante a permanência.
verificacao_posicao = 20,45
; Intervalo dos micro-inputs quando habilitados.
keep_alive = 25,40
; Tempo segurando a tecla de keep-alive.
duracao_tecla = 0.03,0.08
; Reconecta aproximadamente a cada 30 segundos, com variação configurável.
reconexao = 28,32
; Tempo para estabilizar o foco após ativar/restaurar a janela.
apos_foco = 0.2,0.4
; Atualização da contagem regressiva no console.
contagem = 0.25,0.6
; Pausa entre leituras na tela de validação, além do tempo gasto no OCR.
validacao = 0.15,0.3
; Poll de segurança e da GUI: máximo permitido 0.1s; não aumente para economizar CPU.
watchdog = 0.02,0.05
; Timeout de conexão/leitura HTTP; não bloqueia a thread de emergência.
timeout_webhook = 3,6
